# Render blueprint - the whole application, free tier, no credit card.
#
# One container serves the React interface and the FastAPI API from a single
# origin, with the three trained models running on ONNX Runtime. The result is
# a permanent HTTPS address that works from any device on any network.
#
# This fits the free plan only because the models were moved off TensorFlow.
# Measured on these three models: TensorFlow peaks at 579 MB resident, ONNX
# Runtime at 117 MB. The free instance has 512 MB, so the TensorFlow build was
# killed on import; the ONNX build uses roughly 250 MB all in.
#
# Deploy: push to GitHub, then in Render choose "New > Blueprint" and point it
# at this repository. Render assigns https://<name>.onrender.com.

services:
  - type: web
    name: smart-sugarcane-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/system/health

    envVars:
      # Render generates a strong value and keeps it stable across deploys.
      - key: SECRET_KEY
        generateValue: true

      # The interface is served by this same service, so nothing makes a
      # cross-origin request and this list only needs to cover the service's
      # own URL. Set it after the first deploy, when Render has assigned one.
      - key: CORS_ORIGINS
        sync: false

      - key: MODEL_MODE
        value: auto

      - key: MAX_UPLOAD_MB
        value: "10"

      # Optional live weather. Leave unset and the app says so rather than
      # inventing values.
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DEFAULT_WEATHER_CITY
        value: Belagavi,IN

      # ---------------------------------------------------------------
      # DATABASE_URL is deliberately not set.
      #
      # Without it the app uses SQLite inside the container, which is WIPED
      # whenever the service redeploys, restarts, or wakes from a spin-down.
      # Accounts and saved analyses do not survive. That is acceptable for a
      # demonstration and not for real use.
      #
      # For data that persists, create a free Render PostgreSQL instance (or
      # use any managed Postgres) and set:
      #   DATABASE_URL=postgresql+psycopg://user:pass@host/dbname
      # The psycopg driver is already in backend/requirements.txt.
      # ---------------------------------------------------------------

    # Free instances have no persistent disk. On a paid plan, uncomment this
    # and set UPLOAD_DIR=/var/data/uploads to keep photographs across deploys.
    #
    # disk:
    #   name: sugarcane-data
    #   mountPath: /var/data
    #   sizeGB: 1

# Known behaviour of the free plan, so it is not mistaken for a fault:
#
#   * The service spins down after 15 minutes without traffic, and the next
#     request waits about a minute while it starts again. Loading three ONNX
#     models is quick; most of that minute is the container itself.
#   * 750 instance hours per workspace per month, which covers one service
#     running continuously.
#   * Uploaded photographs and the SQLite database are lost on every restart
#     unless DATABASE_URL points somewhere external.
